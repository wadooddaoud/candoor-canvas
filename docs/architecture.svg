<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Candoor Canvas architecture</title>
  <desc id="desc">Human controls and six WebMCP tools both dispatch to a shared reducer, which updates the visible resume, deterministic scoring, advisor matching, event rail, and local handoff preview without external writes.</desc>
  <rect width="1600" height="900" fill="#f1eddf"/>
  <text x="90" y="105" fill="#102a5c" font-family="Georgia,serif" font-size="58" font-weight="600">One state. Two collaborators.</text>
  <text x="92" y="145" fill="#54534c" font-family="Arial,sans-serif" font-size="20">Candoor Canvas · WebMCP Challenge architecture</text>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="250" width="300" height="130" rx="18" fill="#fbf8ef" stroke="#102a5c" stroke-width="2"/>
    <text x="125" y="300" fill="#123ca6" font-size="16" font-weight="700">HUMAN</text><text x="125" y="340" fill="#102a5c" font-size="26" font-weight="700">Manual controls</text>
    <rect x="90" y="520" width="300" height="130" rx="18" fill="#102a5c"/>
    <text x="125" y="570" fill="#9bb4f4" font-size="16" font-weight="700">AGENT</text><text x="125" y="610" fill="#ffffff" font-size="26" font-weight="700">6 WebMCP tools</text>
    <path d="M390 315H575" stroke="#123ca6" stroke-width="5"/><path d="M390 585H575" stroke="#123ca6" stroke-width="5"/><path d="M558 301l24 14-24 14z" fill="#123ca6"/><path d="M558 571l24 14-24 14z" fill="#123ca6"/>
    <rect x="585" y="340" width="360" height="220" rx="28" fill="#123ca6"/>
    <text x="635" y="405" fill="#b8c9f6" font-size="16" font-weight="700">TRUST BOUNDARY</text><text x="635" y="462" fill="#ffffff" font-family="Georgia,serif" font-size="40" font-weight="600">Shared typed reducer</text><text x="635" y="507" fill="#d9e2fa" font-size="19">Versioned · deterministic · in-memory</text>
    <path d="M945 450H1085" stroke="#123ca6" stroke-width="5"/><path d="M1068 436l24 14-24 14z" fill="#123ca6"/>
    <rect x="1095" y="210" width="390" height="105" rx="16" fill="#fbf8ef" stroke="#ccd2df"/><text x="1130" y="254" fill="#102a5c" font-size="21" font-weight="700">Resume canvas + inline diff</text><text x="1130" y="283" fill="#54534c" font-size="16">Visible diagnosis, proposal, acceptance</text>
    <rect x="1095" y="335" width="390" height="105" rx="16" fill="#fbf8ef" stroke="#ccd2df"/><text x="1130" y="379" fill="#102a5c" font-size="21" font-weight="700">Score + advisor matching</text><text x="1130" y="408" fill="#54534c" font-size="16">Calculated locally from visible rules</text>
    <rect x="1095" y="460" width="390" height="105" rx="16" fill="#fbf8ef" stroke="#ccd2df"/><text x="1130" y="504" fill="#102a5c" font-size="21" font-weight="700">Live event rail</text><text x="1130" y="533" fill="#54534c" font-size="16">Human and agent actions stay legible</text>
    <rect x="1095" y="585" width="390" height="105" rx="16" fill="#e4f0e7" stroke="#19684d"/><text x="1130" y="629" fill="#19684d" font-size="21" font-weight="700">Reviewable handoff preview</text><text x="1130" y="658" fill="#384f48" font-size="16">Copy only · no external write</text>
    <rect x="585" y="720" width="900" height="78" rx="14" fill="#fff0d7" stroke="#e99a2f"/>
    <text x="635" y="769" fill="#71460d" font-size="19" font-weight="700">Production isolation: no auth · no database · no booking · no private data · no API keys</text>
  </g>
</svg>
